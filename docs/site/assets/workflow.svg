<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" role="img" aria-labelledby="title desc"><title id="title">Autoresearch for medical imaging</title><desc id="desc">Bring labeled 2D images, run fixed-budget recipe search using validation metrics, refine and train diverse finalists longer, then evaluate saved checkpoints on held-out test data.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#30514b" stroke-width=".7"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="none" stroke="#9bc3a4" stroke-width="1.5"/></marker></defs><rect width="1400" height="440" rx="12" fill="#123a36"/><rect width="1400" height="440" rx="12" fill="url(#grid)" opacity=".5"/><g font-family="Arial,sans-serif"><text x="48" y="56" fill="#eff5e8" font-size="30" font-weight="600">Autonomous search. Deliberate validation.</text><text x="48" y="87" fill="#adc9b4" font-size="16">A reproducible experiment loop for your labeled 2D medical images</text><g fill="#1b443c" stroke="#4c7360"><rect x="48" y="133" width="289" height="219" rx="6"/><rect x="386" y="133" width="289" height="219" rx="6"/><rect x="724" y="133" width="289" height="219" rx="6"/><rect x="1062" y="133" width="289" height="219" rx="6"/></g><g font-family="monospace" fill="#a6c5ac" font-size="12"><text x="69" y="163">01 / YOUR DATA</text><text x="407" y="163">02 / SEARCH</text><text x="745" y="163">03 / PROMOTE</text><text x="1083" y="163">04 / EVALUATE</text></g><g fill="none" stroke="#9bc3a4" stroke-width="2" marker-end="url(#arrow)"><path d="M345 243H375"/><path d="M683 243H713"/><path d="M1021 243H1051"/></g><g fill="#a9c99b"><rect x="69" y="189" width="36" height="36" rx="3"/><rect x="111" y="189" width="36" height="36" rx="3" opacity=".45"/><rect x="153" y="189" width="36" height="36" rx="3" opacity=".7"/><rect x="407" y="209" width="44" height="8" rx="2"/><rect x="459" y="196" width="44" height="21" rx="2" opacity=".65"/><rect x="511" y="183" width="44" height="34" rx="2"/><path d="M746 212h27v-23h26v23h27v-39h26v39h27" fill="none" stroke="#a9c99b" stroke-width="4"/><path d="M1084 191h20m-20 12h43m-43 12h67" fill="none" stroke="#a9c99b" stroke-width="5"/></g><g fill="#eff5e8" font-size="23"><text x="69" y="265">Prepare the contract.</text><text x="407" y="265">Explore candidates.</text><text x="745" y="265">Train finalists longer.</text><text x="1083" y="265">Report the evidence.</text></g><g fill="#aecab6" font-size="15"><text x="69" y="294">Labels, masks, and fixed splits</text><text x="69" y="320">Classification or segmentation</text><text x="407" y="294">Backbones, losses, augmentation</text><text x="407" y="320">Fixed time budget · validation only</text><text x="745" y="294">Refine multiple promising branches</text><text x="745" y="320">Re-check short-run rankings</text><text x="1083" y="294">Saved checkpoint · held-out test</text><text x="1083" y="320">Traceable results and artifacts</text></g><path d="M530 362v21h337v-21" fill="none" stroke="#6f9d7e" stroke-width="1.5" stroke-dasharray="5 5"/><g font-family="monospace" fill="#8bad96" font-size="11"><text x="48" y="411">autoresearch-medimage</text><text x="700" y="405" text-anchor="middle">search → refine → validate</text><text x="1351" y="411" text-anchor="end">Workflow schematic / no patient data</text></g></g></svg>
