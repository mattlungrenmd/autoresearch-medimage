# ChestX-ray14 search candidate - ConvNeXt Tiny backbone
# Modern convolutional baseline for recipe-space autoresearch

paper:
  title: "ChestX-ray14 search candidate: ConvNeXt Tiny"
  dataset: "NIH ChestX-ray14"
  reported_metric: "Recipe-space search candidate"

dataset: chestxray14
task: multilabel

model:
  backbone: convnext_tiny
  pretrained: true
  dropout: 0.2

training:
  batch_size: 16
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.05
  warmdown_ratio: 0.3

loss:
  type: focal
  focal_gamma: 2.0
  class_weights: true

augmentation:
  horizontal_flip: true
  vertical_flip: false
  rotation: 10
  color_jitter: true
  color_jitter_brightness: 0.15
  color_jitter_contrast: 0.15

notes: |
  ConvNeXt Tiny gives the Colab search notebook a modern convolutional option
  that is still T4-friendly. It is slower than EfficientNet-B0 but often a
  stronger backbone family to test in a short fixed-budget session.
