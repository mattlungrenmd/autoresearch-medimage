# Retinal OCT classification with RETFound backbone
# RETFound pretrained on 1.6M retinal images (fundus + OCT) via MAE
#
# Expected: High accuracy on OCT classification (CNV/DME/Drusen/Normal)
# due to OCT-specific pretraining data

paper:
  title: "OCT Classification with RETFound backbone"
  dataset: "Kermany 2018 Retinal OCT"
  reported_metric: "Accuracy ~99%+ (expected with retinal pretraining)"

dataset: oct
task: classification

model:
  backbone: "hf:rmaphoh/RETFound_MAE"
  pretrained: true
  dropout: 0.2

training:
  batch_size: 16
  optimizer: adamw
  learning_rate: 0.00003
  weight_decay: 0.01
  warmup_ratio: 0.05
  warmdown_ratio: 0.3

loss:
  type: cross_entropy
  class_weights: true

notes: |
  RETFound was pretrained on both fundus and OCT images, making it
  ideal for OCT classification. The Kermany 2018 dataset has 4 classes
  (CNV, DME, Drusen, Normal) and is relatively large, so fine-tuning
  should converge quickly. RETFound's MAE pretraining on OCT data
  gives it an inherent advantage over ImageNet-pretrained models.
