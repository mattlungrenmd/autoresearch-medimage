# Template: custom 2D classification baseline
# Copy this recipe and change the dataset name and hyperparameters for your task.

dataset: your_dataset
task: classification

model:
  backbone: efficientnet_b3
  pretrained: true
  dropout: 0.2

training:
  batch_size: 16
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.01
  warmup_ratio: 0.05
  warmdown_ratio: 0.3

loss:
  type: cross_entropy
  class_weights: true

augmentation:
  horizontal_flip: true
  vertical_flip: false
  rotation: 10
  color_jitter: true
  color_jitter_brightness: 0.1
  color_jitter_contrast: 0.1
