# ChestX-ray14 search candidate - ResNet-50 backbone
# T4-friendly recipe for recipe-space autoresearch sessions

paper:
  title: "ChestX-ray14 search candidate: ResNet-50"
  dataset: "NIH ChestX-ray14"
  reported_metric: "Recipe-space search candidate"

dataset: chestxray14
task: multilabel

model:
  backbone: resnet50
  pretrained: true
  dropout: 0.3

training:
  batch_size: 24
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.01
  warmup_ratio: 0.05
  warmdown_ratio: 0.3

loss:
  type: focal
  focal_gamma: 2.0
  class_weights: true

augmentation:
  horizontal_flip: true
  vertical_flip: false
  rotation: 10
  color_jitter: true
  color_jitter_brightness: 0.15
  color_jitter_contrast: 0.15

notes: |
  A strong CNN baseline for Colab search sessions. ResNet-50 is lighter than
  larger DenseNet variants while still providing a meaningful architecture
  change from the canonical CheXNet DenseNet-121 baseline.
