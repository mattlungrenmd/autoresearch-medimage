dataset: chestxray14
task: multilabel

model:
  backbone: resnet50
  pretrained: true
  dropout: 0.2

training:
  batch_size: 24
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.0001
  warmup_ratio: 0.05
  warmdown_ratio: 0.3

loss:
  type: focal
  focal_gamma: 2.0
  class_weights: true

augmentation:
  horizontal_flip: true
  vertical_flip: false
  rotation: 10
  color_jitter: true
  color_jitter_brightness: 0.1
  color_jitter_contrast: 0.1

image_size: 224

notes: |
  Architecture-first frontier recipe for a fixed 300-second ChestX-ray14 run.
  ResNet-50 is included as a stable torchvision baseline with strong tooling
  and predictable memory use on a 12 GB GPU.
