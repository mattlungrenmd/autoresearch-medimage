# APTOS 2019 Blindness Detection — Kaggle 1st Place Approach
# https://www.kaggle.com/c/aptos2019-blindness-detection
#
# Top solutions used EfficientNet-B5/B7 with heavy augmentation
# Target: Quadratic Kappa ~0.93

paper:
  title: "APTOS 2019 Blindness Detection — Kaggle Competition"
  year: 2019
  dataset: "APTOS 2019 (Diabetic Retinopathy)"
  reported_metric: "Quadratic Kappa 0.936"

dataset: aptos
task: classification

model:
  backbone: efficientnet_b3
  pretrained: true
  dropout: 0.3

training:
  batch_size: 32
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.01
  warmup_ratio: 0.05
  warmdown_ratio: 0.4
  label_smoothing: 0.1

loss:
  type: cross_entropy
  class_weights: true

augmentation:
  horizontal_flip: true
  vertical_flip: true
  rotation: 15
  color_jitter: true
  color_jitter_brightness: 0.2
  color_jitter_contrast: 0.2
  clahe: true

image_size: 384

notes: |
  Top Kaggle solutions for APTOS 2019 DR grading used:
  - EfficientNet family (B3-B7) as backbone
  - Larger input resolution (384-512) for fine-grained retinal details
  - CLAHE preprocessing on fundus images
  - Heavy augmentation including rotation, flips, color jitter
  - Ordinal regression or regression-based approaches improved kappa
  - Test-time augmentation (horizontal + vertical flip)
  - Label smoothing to handle noisy annotations
  Winner achieved QWK 0.936 on private leaderboard.
