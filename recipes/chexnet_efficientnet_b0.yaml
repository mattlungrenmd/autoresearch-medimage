# ChestX-ray14 search candidate - EfficientNet-B0 backbone
# Small, fast backbone intended for Colab recipe-space sweeps

paper:
  title: "ChestX-ray14 search candidate: EfficientNet-B0"
  dataset: "NIH ChestX-ray14"
  reported_metric: "Recipe-space search candidate"

dataset: chestxray14
task: multilabel

model:
  backbone: efficientnet_b0
  pretrained: true
  dropout: 0.3

training:
  batch_size: 32
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.01
  warmup_ratio: 0.05
  warmdown_ratio: 0.3

loss:
  type: focal
  focal_gamma: 2.0
  class_weights: true

augmentation:
  horizontal_flip: true
  vertical_flip: false
  rotation: 10
  color_jitter: true
  color_jitter_brightness: 0.15
  color_jitter_contrast: 0.15

notes: |
  EfficientNet-B0 trades some capacity for throughput, which makes it useful
  for Colab experiments where the practical goal is more completed search runs
  per session rather than maximum single-model capacity.
