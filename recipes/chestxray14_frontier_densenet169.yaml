# ChestXray14 frontier candidate - DenseNet-169
# Fixed-recipe backbone comparison under the 300-second contract

paper:
  title: "ChestXray14 frontier candidate: DenseNet-169"
  dataset: "NIH ChestX-ray14"
  reported_metric: "300-second backbone frontier candidate"

dataset: chestxray14
task: multilabel

model:
  backbone: densenet169
  pretrained: true
  dropout: 0.2

training:
  batch_size: 16
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.0001
  warmup_ratio: 0.05
  warmdown_ratio: 0.3

loss:
  type: focal
  focal_gamma: 2.0
  class_weights: true

augmentation:
  horizontal_flip: true
  vertical_flip: false
  rotation: 10
  color_jitter: true
  color_jitter_brightness: 0.1
  color_jitter_contrast: 0.1

image_size: 224

notes: |
  Architecture-first frontier recipe for a fixed 300-second ChestXray14 run.
  DenseNet-169 keeps the DenseNet family but spends more capacity than the
  classic DenseNet-121 baseline.
