# Ordinal regression for diabetic retinopathy grading (APTOS 2019)
# Uses ordinal loss to respect the natural severity ordering (0-4).
# Expected: 0.02-0.05 kappa improvement over standard cross-entropy.

dataset: aptos

model:
  backbone: efficientnet_b3
  pretrained: true
  dropout: 0.3

training:
  batch_size: 16
  learning_rate: 0.0003
  optimizer: adamw
  weight_decay: 0.01
  warmup_ratio: 0.05
  warmdown_ratio: 0.3

loss:
  type: ordinal               # ordinal regression (cumulative binary)
  class_weights: true

augmentation:
  horizontal_flip: true
  vertical_flip: true
  rotation: 15
  color_jitter: true
  color_jitter_brightness: 0.2
  color_jitter_contrast: 0.2
  coarse_dropout: true
  coarse_dropout_ratio: 0.05

advanced:
  grad_clip_norm: 1.0
  ema: true
  ema_decay: 0.999
  tta: true
  cutmix: true
  cutmix_alpha: 1.0
  lr_schedule: one_cycle
  compute_ci: true
  llrd: true
  llrd_decay: 0.85

paper:
  title: "Ordinal DR Grading (APTOS)"
  description: "Ordinal regression for severity-aware diabetic retinopathy classification"
  reported_metric: "kappa ~0.93 (Kaggle top solutions)"
