[project]
name = "autoresearch-vision"
version = "0.1.0"
description = "Autonomous AI research for image classification and segmentation"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "matplotlib>=3.8.0",
    "pandas>=2.1.0",
]

[tool.uv]
find-links = [
    "https://download.pytorch.org/whl/cu124",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
