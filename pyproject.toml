[project]
name = "autoresearch-medimage"
version = "0.1.0"
description = "Autonomous AI research for medical image classification and segmentation"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "matplotlib>=3.8.0",
    "pandas>=2.1.0",
    "PyYAML>=6.0.1",
    "scikit-learn>=1.4.0",
    "kaggle>=1.6.0",
    "opencv-python-headless>=4.9.0",
    "albumentations>=1.4.0",
    "timm>=1.0.0",
]

[project.optional-dependencies]
foundation = [
    "transformers>=4.40.0",
    "huggingface_hub>=0.23.0",
    "safetensors>=0.4.0",
]
deploy = [
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
]
dicom = [
    "pydicom>=2.4.0",
]
all = [
    "autoresearch-medimage[foundation,deploy,dicom]",
]

[project.urls]
Repository = "https://github.com/mlungrengmail/autoresearch-medimage"

[tool.uv]
find-links = [
    "https://download.pytorch.org/whl/cu124",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
