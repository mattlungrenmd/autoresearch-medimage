dataset: chestxray14
task: multilabel
primary_metric: mean_auc
default_max_runs: 24

seed_recipes:
  - chestxray14_baseline
  - chestxray14_advanced
  - chestxray14_resnet50
  - chestxray14_convnext_tiny
  - chestxray14_efficientnet_b0

backbone_pool:
  - densenet121
  - densenet169
  - resnet50
  - convnext_tiny
  - efficientnet_b0
  - efficientnet_b1

mutation_families:
  - backbone_swap
  - optimizer_scheduler
  - lr_wd
  - batch_image
  - regularization
  - augmentation
  - loss

ranges:
  learning_rate: [0.0001, 0.0002, 0.0003, 0.0005, 0.001]
  weight_decay: [0.0, 0.00001, 0.0001, 0.001, 0.01]
  dropout: [0.1, 0.2, 0.3, 0.4]
  batch_size: [8, 16, 24, 32]
  image_size: [224, 256, 288]
  label_smoothing: [0.0, 0.05, 0.1]

categorical_choices:
  optimizer: [adamw, adam, sgd]
  lr_schedule: [cosine, one_cycle, constant]
  loss_type: [bce, focal]
  augmentation_presets:
    mild:
      horizontal_flip: true
      vertical_flip: false
      rotation: 5
      color_jitter: false
      clahe: false
      elastic_transform: false
      grid_distortion: false
      coarse_dropout: false
      coarse_dropout_ratio: 0.1
    stronger_color:
      horizontal_flip: true
      vertical_flip: false
      rotation: 10
      color_jitter: true
      clahe: false
      elastic_transform: false
      grid_distortion: false
      coarse_dropout: false
      coarse_dropout_ratio: 0.1
    spatial_heavy:
      horizontal_flip: true
      vertical_flip: false
      rotation: 15
      color_jitter: true
      clahe: false
      elastic_transform: false
      grid_distortion: true
      coarse_dropout: true
      coarse_dropout_ratio: 0.1

phase_families:
  default:
    - loss
    - augmentation
    - regularization
    - lr_wd
  explore:
    - loss
    - augmentation
    - regularization
    - lr_wd
    - optimizer_scheduler
  refresh:
    - loss
    - augmentation
    - regularization
    - lr_wd
    - optimizer_scheduler
    - backbone_swap

operator_reward:
  clip: 2.0
  crash_penalty: -1.5

gating_thresholds:
  immediate_keep_delta: 0.25
  confirm_delta: 0.10
  confirmed_mean_delta: 0.15

stagnation_rules:
  explore_after: 8
  refresh_after: 16
  hot_set_size: 4
  global_elite_size: 6
  per_branch_elite: 2
  exploit_children: 3
